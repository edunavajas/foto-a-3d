<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f9f7">
    <title>Foto a 3D</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/vendor/model-viewer.min.js"></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="shell">
      <h1>Foto a 3D</h1>
      <input id="photo" class="visually-hidden" type="file" accept="image/*" capture="environment" aria-describedby="status">
      <label class="capture-button" for="photo">Take a photo</label>
      <p id="status" role="status" aria-live="polite">Ready to capture.</p>
      <model-viewer id="preview" hidden camera-controls touch-action="pan-y" alt="Your generated 3D model" aria-label="Rotate your generated 3D model"></model-viewer>
    </main>
  </body>
</html>
